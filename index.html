/Gb+cOTbOm7yH/BpN/O+szf7Mpa9NQn7R9htnX2vRr/DcxW51veEdyvzkPqZH1aXXK8Rv0davLsf8/XFhteFiJnqkAAAAASUVORK5CYII=);  /* acero cepillado, mosaico 240×48 */
    --steel:#9C9384;    /* estampado secundario */
    --stamp:#EDE3CF;    /* marfil */
    --pin:#C8A25E;      /* oro viejo */
    --pin-ink:#0B0B0C;
    --go:#5CBF72;
    --warn:#EE6A5A;     /* texto de advertencia */
    --warn-fill:#5E4A2E;/* bronce */
    --alu:#EDE3CF; --alu-ink:#0B0B0C; --alu-rule:#C9BCA2;
    /* pintura electrostática de cada máquina */
    --push:#C8A25E; --pull:#C8A25E; --legs:#C8A25E; --upper:#C8A25E; --notes:#C8A25E;
    --accent:var(--push);
    --fd:'Big Shoulders Display',sans-serif;
    --ft:'Big Shoulders Text',sans-serif;
    --fb:'Barlow',system-ui,sans-serif;
  }

  html{background:var(--ink);color:var(--stamp)}
  body{background:var(--ink);color:var(--stamp);font-family:var(--fb);font-size:16px;line-height:1.45;
       padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
       caret-color:var(--pin);scrollbar-color:var(--edge) var(--ink)}
  ::selection{background:var(--pin);color:var(--pin-ink)}
  :focus-visible{outline:2px solid var(--pin);outline-offset:2px}
  button{font:inherit;color:inherit}
  input,table,.delta,.spec,.sets,.num,.tally,.prev,.equiv,.hist li,.convtab{font-variant-numeric:tabular-nums}
  .wrap{max-width:560px;margin:0 auto}
  .ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico.fill{fill:currentColor;stroke:none}

  /* ---- Franja superior ---- */
  .top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--ink);
       border-bottom:1px solid var(--rule);box-shadow:0 8px 16px -10px rgba(0,0,0,.8)}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px}
  .brand .logo{display:flex;align-items:center;gap:10px}
  .vmark{display:block;color:var(--pin)}
  .brand .vmark{width:27px;height:27px}
  .brand b{font-family:'Syncopate',var(--fd);font-weight:700;font-size:16.5px;letter-spacing:.16em;line-height:1;color:var(--stamp)}
  #stamp{font-family:var(--ft);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;min-width:62px;min-height:50px;padding:7px 10px 6px;cursor:pointer;
       background:linear-gradient(180deg,#1C1B19,#161514);border:1px solid var(--rule);border-radius:4px;
       font-family:var(--fd);font-weight:800;font-size:17px;line-height:1.05;letter-spacing:.05em;text-transform:uppercase;color:var(--steel);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:background-color .15s,color .15s}
  .tab small{display:block;font-family:var(--ft);font-weight:700;font-size:10px;letter-spacing:.14em;margin-top:2px;opacity:.85}
  .tab[aria-selected="true"]{background:var(--pin);border-color:var(--pin);color:var(--pin-ink);
       box-shadow:0 4px 10px -5px rgba(0,0,0,.9)}
  .tab:active{transform:translateY(1px)}

  /* ---- Encabezado del día: tarjeta obsidiana con un tinte de oro viejo ---- */
  .dayhead{position:relative;overflow:hidden;margin:14px 12px 0;padding:24px 18px 15px;border-radius:12px;color:var(--stamp);
       background-color:#131211;
       background-image:radial-gradient(85% 120% at 95% 20%,rgba(200,162,94,.13),transparent 62%);
       border:1px solid var(--rule);box-shadow:0 10px 22px -12px rgba(0,0,0,.9)}
  .dayhead>*{position:relative;z-index:1}
  /* Opción EMBLEMA: la V acompaña al nombre del día, plana, en oro viejo */
  .dayhead .emb{position:absolute;z-index:0;top:20px;right:16px;width:90px;height:90px;pointer-events:none}
  html[data-layout="emblema"] .dayhead h1,html[data-layout="emblema"] .dayhead .sub{padding-right:96px}
  .dayhead .emb .vmark{width:100%;height:100%}
  .dayhead h1{font-family:var(--fd);font-weight:900;font-size:70px;line-height:.84;letter-spacing:.01em}
  /* Opción FONDO: la V grande, centrada y fija detrás de toda la app */
  .bgmark{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
  .bgmark .vmark{width:min(78vw,430px);height:min(78vw,430px);opacity:.075}
  .wrap{position:relative;z-index:1}
  html[data-layout="emblema"] .bgmark{display:none}
  html[data-layout="fondo"] .dayhead .emb{display:none}
  html[data-layout="fondo"] .dayhead{background-color:rgba(19,18,17,.72)}
  html[data-layout="fondo"] .card{background:rgba(23,23,22,.74)}
  html[data-layout="fondo"] .card.cur{background:rgba(34,32,29,.8)}
  html[data-layout="fondo"] .card.done{background:rgba(14,13,12,.7)}
  html[data-layout="fondo"] .stack{background:transparent}
  html[data-layout="fondo"] .stack::before,html[data-layout="fondo"] .stack::after{display:none}
  .dayhead .sub{margin-top:9px;font-size:15px;font-weight:600;color:#CFC6B4}
  .spec{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 10px;margin-top:14px;padding-top:11px;
       border-top:1px solid rgba(255,255,255,.12);
       font-family:var(--ft);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#B3AA99}
  .spec span:not(.prog)+span:not(.prog)::before{content:'·';margin-right:10px;opacity:.7}
  .spec .prog{margin-left:auto;color:#fff}
  .spec .prog b{font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.02em}

  /* ---- Selectores de dos posiciones ---- */
  .modes{display:flex;flex-wrap:wrap;gap:10px;padding:14px 12px 0}
  .segwrap{flex:1;min-width:150px}
  .seglab{display:block;margin-bottom:6px;font-family:var(--ft);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .seg,.useg{display:flex;padding:3px;border-radius:5px;background:var(--ink2);border:1px solid var(--rule);
       box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
  .seg button,.useg button{flex:1;min-height:42px;border:0;border-radius:3px;background:none;cursor:pointer;
       font-family:var(--ft);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);
       transition:background-color .15s,color .15s}
  .seg button.on,.useg button.on{background:#2F2C28;color:var(--stamp);box-shadow:0 2px 4px rgba(0,0,0,.7)}

  /* ---- Nota del día: una línea, no una caja ---- */
  .banner{display:flex;gap:8px;align-items:flex-start;margin:10px 14px 0;font-size:13.5px;line-height:1.45;color:var(--steel)}
  .banner .ico{width:16px;height:16px;margin-top:2px}

  /* ---- El stack ---- */
  /* Las placas van casi pegadas sobre una junta oscura. Dos varillas corren a lo
     alto: asoman sobre la primera placa, en cada junta y dentro del agujero. */
  .stack{position:relative;list-style:none;margin:30px 12px 0;padding:0;border-radius:4px;background:var(--seam)}
  .stack::before,.stack::after{content:'';position:absolute;z-index:0;top:-20px;bottom:0;width:4px;
       border-radius:2px 2px 0 0;background:var(--rod)}
  .stack::before{left:31px} .stack::after{right:31px}
  .card{position:relative;z-index:1;margin-bottom:2px;border-radius:3px;border:1px solid var(--rule);
       background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.12)),var(--grain) var(--plate);
       box-shadow:0 2px 3px rgba(0,0,0,.6)}
  .card.cur{border-color:var(--edge);
       background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),var(--grain) var(--plate)}
  .card.done{background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.34)),var(--grain) var(--plate)}
  .card.open{border-color:var(--edge)}
  .head{display:flex;align-items:center;gap:12px;width:100%;min-height:74px;padding:12px 12px 12px 10px;
       text-align:left;background:none;border:0;cursor:pointer}
  .num{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:7px;
       font-family:var(--fd);font-weight:900;font-size:23px;line-height:1;color:var(--stamp)}
  /* agujero con la varilla pasando por dentro */
  .num i{display:block;width:13px;height:13px;border-radius:50%;
       background:linear-gradient(90deg,var(--seam) 0 4.5px,var(--rod) 4.5px 8.5px,var(--seam) 8.5px);
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.8)}
  .done .num{color:var(--steel)}
  .body{flex:1;min-width:0}
  .name{display:block;font-family:var(--ft);font-weight:800;font-size:18px;line-height:1.12;letter-spacing:.03em;
       text-transform:uppercase;color:var(--stamp)}
  .done .name{color:var(--steel)}
  .target{display:block;margin-top:3px;font-size:13.5px;color:var(--steel)}
  .pick{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-size:15px;font-weight:600;line-height:1.3;color:var(--stamp)}
  .pick b{flex:none;font-family:var(--ft);font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--steel)}
  .prev{display:block;margin-top:6px;font-size:13.5px;color:var(--steel)}
  .tally{display:block;margin-top:5px;font-size:14px;font-weight:600;color:#CFC6B4}
  .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  /* las series van estampadas en la cara de la placa, como el peso en una placa real */
  .sets{font-family:var(--fd);font-weight:900;font-size:19px;line-height:1;letter-spacing:.02em;color:var(--steel)}
  .cur .sets{color:var(--stamp)}
  .tick{display:grid;place-items:center;width:40px;height:40px;border-radius:4px;cursor:pointer;color:transparent;
       background:var(--ink2);border:1px solid var(--rule);box-shadow:inset 0 2px 3px rgba(0,0,0,.75);
       transition:background-color .15s,border-color .15s,color .15s}
  .tick .ico{width:22px;height:22px;stroke-width:3}
  .done .tick{background:var(--edge);border-color:var(--edge);color:var(--stamp);box-shadow:none}
  .chev{display:grid;color:var(--steel);transition:transform .2s}
  .open .chev{transform:rotate(180deg)}

  /* el pasador en L: amarillo mate, un canto más oscuro y nada de reflejo */
  .pin{position:absolute;z-index:3;left:4px;top:0;width:40px;height:8px;margin-top:-4px;pointer-events:none;
       border-radius:0 4px 4px 0;background:var(--pin);box-shadow:inset 0 -1px 0 var(--pin-edge),0 2px 3px rgba(0,0,0,.7)}
  .pin::before{content:'';position:absolute;left:-7px;top:-15px;width:9px;height:27px;border-radius:4px;
       background:var(--pin);box-shadow:inset -1px 0 0 var(--pin-edge),0 2px 3px rgba(0,0,0,.7)}

  /* ---- Ficha abierta ---- */
  .panel{display:none;padding:0 12px 16px}
  .open .panel{display:block}
  .opthead{margin:2px 0 8px;font-family:var(--ft);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .optrow{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
  .opt{flex:1;display:flex;align-items:center;gap:11px;min-height:48px;padding:10px 12px;text-align:left;cursor:pointer;
       border-radius:4px;border:1px solid transparent;background:var(--ink2);font-size:15.5px;line-height:1.25;color:#DDD3BF;
       box-shadow:inset 0 1px 2px rgba(0,0,0,.65);transition:border-color .15s,background-color .15s}
  .opt .dot{flex:none;width:15px;height:15px;border-radius:50%;background:var(--ink);
       box-shadow:inset 0 2px 3px rgba(0,0,0,.95),0 0 0 1px var(--rule)}
  .opt.on{border-color:var(--edge);background:#252320;color:var(--stamp);font-weight:600;box-shadow:none}
  .opt.on .dot{background:var(--stamp);box-shadow:0 0 0 3px #252320,0 0 0 4px var(--steel)}
  .flag,.stale{flex:none;margin-left:auto;font-family:var(--ft);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
  .flag{color:var(--stamp)} .stale{color:var(--steel)}
  .help{flex:none;width:48px;display:grid;place-items:center;border-radius:4px;cursor:pointer;
       background:var(--ink2);border:1px solid var(--rule);color:var(--steel);transition:color .15s,border-color .15s}
  .help .ico{width:20px;height:20px}
  .help.on{color:var(--stamp);border-color:var(--edge)}

  /* placa de instrucciones de la máquina */
  .guide{position:relative;margin:0 0 8px;border-radius:4px;overflow:hidden;color:var(--alu-ink);
       background:var(--alu) linear-gradient(180deg,rgba(255,255,255,.4),rgba(0,0,0,.06));
       box-shadow:0 5px 12px -5px rgba(0,0,0,.85)}
  .guide .gh{padding:7px 12px;background:var(--warn-fill);color:#fff;
       font-family:var(--ft);font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .guide .gb{display:flex;gap:12px;padding:12px 12px 16px}
  .guide::before,.guide::after{content:'';position:absolute;bottom:6px;width:7px;height:7px;border-radius:50%;
       background:#A69A83}
  .guide::before{left:6px} .guide::after{right:6px}
  .guide img{flex:none;width:120px;height:auto;align-self:flex-start;border-radius:3px;background:#fff;padding:4px;border:1px solid var(--alu-rule)}
  .gtx{flex:1;min-width:0}
  .guide p{font-size:14px;line-height:1.45;color:#1E1B17;margin-bottom:10px}
  .vid{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 13px 8px 11px;border-radius:4px;
       background:var(--alu-ink);color:#fff;text-decoration:none;
       font-family:var(--ft);font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
  .vid .ico{width:15px;height:15px}
  .cred{font-size:11.5px;color:#5A5143;margin:9px 0 0}
  .cred a{color:inherit}
  @media(max-width:400px){.guide .gb{flex-direction:column}.guide img{width:100%;max-width:180px}}

  /* ---- Registro de series ---- */
  .log{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule)}
  .unitbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .unitbar .ul{font-family:var(--ft);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .useg{width:140px} .useg button{min-height:44px;font-size:12px}
  .goal{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:4px;margin-bottom:8px;
       background:var(--ink2);border:1px solid var(--rule)}
  .goal .k{flex:none;padding:3px 7px;border-radius:3px;background:var(--rule);color:var(--stamp);
       font-family:var(--ft);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .goal.rise .k{background:var(--pin);color:var(--pin-ink)}
  .goal.none .k{background:none;color:var(--steel);padding-left:0}
  .goal .v{font-size:14.5px;line-height:1.4;color:#CFC6B4}
  .goal .v b{color:var(--stamp);font-weight:700}
  .goal .v i{font-style:normal;color:var(--steel)}
  .hint{margin:0 0 10px;font-size:12.5px;color:var(--steel)}
  .row{display:flex;align-items:center;gap:4px;margin-bottom:7px}
  .row .s{flex:none;width:20px;font-family:var(--fd);font-weight:900;font-size:15px;color:var(--steel)}
  .fld{flex:1;min-width:0;display:flex;align-items:center;padding:0 9px;border-radius:4px;background:var(--ink2);
       border:1px solid var(--rule);box-shadow:inset 0 2px 3px rgba(0,0,0,.75);transition:border-color .15s}
  .fld:focus-within{border-color:var(--pin)}
  .fld input{width:100%;min-width:0;padding:11px 0;border:0;background:none;text-align:right;
       font-family:var(--fb);font-weight:700;font-size:18px;color:var(--stamp)}
  .fld input:focus{outline:none}
  .fld input::placeholder{color:var(--steel);font-weight:500}
  .fld u{padding-left:6px;text-decoration:none;font-family:var(--ft);font-weight:800;font-size:10.5px;letter-spacing:.1em;color:var(--steel)}
  .row .x{flex:none;color:var(--steel);font-size:14px}
  .dsb{flex:none;width:44px;min-height:44px;border-radius:4px;cursor:pointer;background:none;border:1px solid var(--rule);
       color:var(--steel);font-family:var(--ft);font-weight:800;font-size:11.5px;letter-spacing:.04em;transition:background-color .15s,color .15s}
  .dsb.on{background:var(--warn-fill);border-color:var(--warn-fill);color:#fff}
  /* lo que superaste es el dato más importante de la fila: va estampado */
  .delta{flex:none;width:56px;text-align:right;white-space:nowrap;font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:.01em}
  .delta.u{color:var(--go)} .delta.d{color:var(--warn)} .delta.e{color:var(--steel)}
  .droprow{display:flex;align-items:center;gap:4px;margin:-2px 0 7px 24px}
  .droprow .dl{flex:none;display:flex;align-items:center;gap:2px;font-family:var(--ft);font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--steel)}
  .droprow .dl .ico{width:15px;height:15px}
  .droprow .fld input{font-size:16px;padding:8px 0}
  .dstep,.stepper{display:flex;align-items:center;gap:8px}
  .dstep{margin:-2px 0 10px 24px}
  .stepper{margin-top:6px}
  .dstep button,.stepper button{flex:none;display:grid;place-items:center;width:46px;height:44px;border-radius:4px;cursor:pointer;
       background:#1F1D1B;border:1px solid var(--rule);color:var(--stamp)}
  .dstep button{width:44px}
  .dstep button:disabled,.stepper button:disabled{opacity:.35;cursor:default}
  .dstep span,.stepper span{font-family:var(--ft);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
  .stepper span{flex:1;text-align:center}
  .equiv{display:flex;gap:6px;margin:2px 0 8px 24px;font-size:13px;color:var(--steel)}
  .equiv b{color:var(--stamp)}
  .hist{margin-top:14px}
  .hist summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:40px;cursor:pointer;
       font-family:var(--ft);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .hist summary::-webkit-details-marker{display:none}
  .hist summary .ico{transition:transform .2s}
  .hist[open] summary .ico{transform:rotate(180deg)}
  .hist ul{list-style:none}
  .hist li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;color:#CFC6B4}
  .hist li span{flex:none;width:58px;color:var(--steel)}

  /* ---- Cierre ---- */
  .finish{padding:20px 12px 34px}
  .finish button{width:100%;min-height:60px;border:0;border-radius:5px;cursor:pointer;
       background-color:var(--pin);color:var(--pin-ink);
       font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.08em;text-transform:uppercase;
       box-shadow:inset 0 -2px 0 var(--pin-edge),0 6px 14px -6px rgba(0,0,0,.95)}
  .finish button:active{transform:translateY(1px)}
  .finish button:disabled{background-color:var(--plate);background-image:none;color:var(--steel);box-shadow:inset 0 0 0 1px var(--rule);cursor:default}
  .finish p{margin-top:12px;font-size:13px;line-height:1.5;color:var(--steel);text-align:center}

  /* ---- Notas ---- */
  .notes{padding:22px 16px 40px}
  .notes h2{margin:36px 0 10px;font-family:var(--fd);font-weight:900;font-size:25px;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:var(--stamp)}
  .notes h2:first-child{margin-top:6px}
  .notes p{max-width:68ch;margin-bottom:12px;font-size:15.5px;line-height:1.55;color:#CFC6B4}
  .notes p b{color:var(--stamp);font-weight:700}
  .notes p i{font-style:normal;color:var(--stamp)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:9px 6px;border-bottom:1px solid var(--rule);text-align:left}
  th{font-family:var(--ft);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  td:nth-child(n+2),th:nth-child(n+2){text-align:right}
  td:nth-child(3){color:var(--steel)}
  .conv{position:relative;margin-bottom:14px;padding:14px 14px 18px;border-radius:4px;color:var(--alu-ink);
       background:var(--alu) linear-gradient(180deg,rgba(255,255,255,.4),rgba(0,0,0,.06));box-shadow:0 5px 12px -5px rgba(0,0,0,.85)}
  .conv::before,.conv::after{content:'';position:absolute;bottom:6px;width:7px;height:7px;border-radius:50%;
       background:#A69A83}
  .conv::before{left:6px} .conv::after{right:6px}
  .convrow{display:flex;align-items:center;gap:10px}
  .conv .fld{background:#fff;border-color:var(--alu-rule);box-shadow:inset 0 2px 3px rgba(0,0,0,.14)}
  .conv .fld:focus-within{border-color:var(--alu-ink)}
  .conv .fld input{color:var(--alu-ink)}
  .conv .fld input::placeholder{color:#6B6150}
  .conv .fld u{color:#4A4235}
  .conv .sw{display:grid;color:#4A4235}
  .convtab{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:13px;color:#3E372C}
  .convtab b{color:var(--alu-ink)}
  /* ---- Respaldo ---- */
  .bk{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .bk h3{margin:14px 0 2px;font-family:var(--ft);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .bksum{margin:0 0 4px}
  .bkbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:5px;cursor:pointer;
       background:var(--plate);border:1px solid var(--rule);color:var(--stamp);
       font-family:var(--ft);font-weight:800;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase}
  .bkbtn.main{background:var(--pin);border-color:var(--pin);color:var(--pin-ink)}
  .bkta{width:100%;min-height:92px;padding:10px 12px;border-radius:5px;resize:vertical;background:var(--ink2);border:1px solid var(--rule);
       color:var(--stamp);font:13px/1.4 ui-monospace,Menlo,monospace}
  .bkta:focus{outline:none;border-color:var(--pin)}
  .bkmsg{min-height:1.4em;margin:2px 0 0;font-size:14px;color:var(--go)}
  .bkmsg.bad{color:var(--warn)}
  .reset{width:100%;min-height:48px;margin-top:28px;border-radius:5px;cursor:pointer;background:none;border:1px solid #4A2420;
       color:var(--warn);font-family:var(--ft);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase}

  /* ---- Herramientas de la ficha: descanso y progreso ---- */
  .tools{display:flex;gap:8px;margin-top:14px}
  .tool{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:5px;cursor:pointer;
       background:var(--ink2);border:1px solid var(--rule);color:var(--stamp);
       font-family:var(--ft);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
  .tool .ico{width:17px;height:17px;color:var(--pin)}
  .tool.on{border-color:var(--pin);color:var(--pin)}
  .pgr{margin-top:10px;padding:12px 12px 10px;border-radius:5px;background:var(--ink2);border:1px solid var(--rule)}
  .pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .pstats b{display:block;font-family:var(--fd);font-weight:800;font-size:19px;line-height:1.05;color:var(--stamp)}
  .pstats span{display:block;margin-top:3px;font-family:var(--ft);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
  .pchart{display:block;width:100%;height:auto;overflow:visible}
  .pax{stroke:var(--rule);stroke-width:1}
  .pline{fill:none;stroke:var(--pin);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .pdot{fill:var(--ink2);stroke:var(--pin);stroke-width:2}
  .pdot.pbest{fill:var(--pin)}
  .ptx{fill:var(--steel);font-family:var(--ft);font-size:10px;letter-spacing:.06em}
  .pnote{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--steel)}

  .rest{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
       width:min(calc(100% - 32px),460px);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:8px;
       background:#141312;border:1px solid var(--pin-edge);box-shadow:0 10px 28px -8px rgba(0,0,0,.95)}
  .rest .rl{font-family:var(--ft);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .rest b{flex:1;font-family:var(--fd);font-weight:900;font-size:30px;line-height:1;letter-spacing:.02em;color:var(--stamp);font-variant-numeric:tabular-nums}
  .rest button{min-width:48px;min-height:44px;padding:0 10px;border-radius:5px;cursor:pointer;background:var(--ink2);border:1px solid var(--rule);
       color:var(--stamp);font-family:var(--ft);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .rest.over{background:var(--pin);border-color:var(--pin)}
  .rest.over .rl,.rest.over b{color:var(--pin-ink)}
  .rest.over button{background:var(--pin-ink);border-color:var(--pin-ink);color:var(--pin)}
  body.resting .finish{padding-bottom:96px}

  .delta.pr{width:auto;padding:3px 6px;border-radius:3px;background:var(--pin);color:var(--pin-ink);
       font-family:var(--ft);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

  .cierre{margin:10px 0 4px;padding:12px 14px 12px;border-radius:8px;background:#131211;border:1px solid var(--pin-edge)}
  .cierre .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
       font-family:var(--ft);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--pin)}
  .cierre .ch button{min-height:36px;padding:0 12px;border-radius:5px;cursor:pointer;background:none;border:1px solid var(--rule);
       color:var(--stamp);font-family:var(--ft);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
  .cierre .pstats{margin-bottom:0}
  .cpr{list-style:none;margin-top:10px}
  .cpr li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px;color:#CFC6B4}
  .cpr i{flex:none;font-style:normal;font-family:var(--ft);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pin)}
  .cpr span{flex:1;min-width:0}
  .cpr b{flex:none;color:var(--stamp);font-weight:700}

  .pstats.const{grid-template-columns:repeat(4,1fr);margin-bottom:14px}
  .cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:420px}
  .cal i{aspect-ratio:1;border-radius:2px;background:var(--plate)}
  .cal i.on{background:var(--pin)}
  .cal i.fut{background:none}
  .cal i.hoy{box-shadow:inset 0 0 0 1px var(--stamp)}
  .notes .pnote b{color:var(--stamp)}

  .week td:first-child{position:relative}
  .alarmseg{margin:4px 0 14px}
  .steps{margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.55;color:#CFC6B4}
  .steps li{margin-bottom:6px}
  .steps b{color:var(--stamp)}
  .wbar{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--rule);overflow:hidden}
  .wbar i{display:block;height:100%;background:var(--steel)}
  .wbar i.ok{background:var(--pin)}
  .week td small{color:var(--steel);font-size:12px}
  .week td.wok{color:var(--pin);font-weight:700}

  @media (hover:hover){
    .tab:not([aria-selected="true"]):hover{color:var(--stamp)}
    .opt:not(.on):hover{border-color:var(--rule)}
    .help:hover,.stepper button:hover,.dstep button:hover{border-color:var(--edge)}
    .card:not(.open) .head:hover .name{color:#fff}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const DAYS = {
  push:{label:'Push',day:'Lunes',color:'var(--push)',title:'PUSH',
    sub:{h:'Pecho · Hombro · Bíceps',n:'Pecho · Hombro · Tríceps'},
    note:{h:'Híbrido: el bíceps entra fresco porque ningún press lo toca.',
          n:'Reparto clásico: el tríceps cierra el día, ya pre-fatigado por los press. Compénsalo con máquinas o poleas.'},ex:[

};

const KEY='split4dias:v2', TOP=10, LB=2.20462;
let S={sel:{},done:{},last:{},log:{},hist:{},mode:{},split:'h',unit:{}};
let day='push', open=null, timer=null, guide=null, prog=null, cierre=null;

/* modo del día: 'largo' (todo) o 'corto' (solo lo marcado con sh) */
const modeOf=k=>(S.mode&&S.mode[k])||'largo';
/* reparto: 'h' híbrido (brazo cruzado) o 'n' normal (push=tríceps, pull=bíceps) */
const splitOf=()=>S.split||'h';
/* unidad de peso, guardada por variante porque el gym mezcla notaciones */
const unitOf=v=>(S.unit&&S.unit[v])||'kg';

/* ejercicios visibles hoy: filtra por reparto y por modo corto */
function exList(k){
  const sp=splitOf(), md=modeOf(k);
  /* co: solo aparece en corto (versiones fusionadas de dos secciones) */
  return DAYS[k].ex.filter(e=>(!e.only||e.only===sp)&&(md==='largo'?!e.co:!!e.sh));
}
/* series objetivo: en corto usa ss si el ejercicio lo define */
const setsOf=(e,k)=>(modeOf(k)==='corto'&&e.ss)?e.ss:e.s;
/* textos que cambian según el reparto */
const txt=(v)=>(typeof v==='string')?v:(v[splitOf()]||v.h);

/* Guarda donde se pueda: almacenamiento de Claude, si no el del navegador, si no en memoria. */
const mem={};
const STORE={
  async get(){
    if(window.storage){try{const r=await window.storage.get(KEY);if(r&&r.value)return r.value;}catch(e){}}
    try{const v=localStorage.getItem(KEY);if(v)return v;}catch(e){}
    return mem[KEY]||null;
  },
  async set(v){
    mem[KEY]=v;
    if(window.storage){try{await window.storage.set(KEY,v);return;}catch(e){}}
    try{localStorage.setItem(KEY,v);}catch(e){}
  }
};

async function load(){
  try{const v=await STORE.get(); if(v) S=Object.assign(S,JSON.parse(v));}catch(e){}
  ['sel','done','last','log','hist','mode','unit','start'].forEach(k=>{S[k]=S[k]||{}});
  if(!Array.isArray(S.ses)) S.ses=[];
  if(S.split!=='h'&&S.split!=='n') S.split='h';
  migrateDrops();
  const m1=migrateNames(), m2=migrateMoves();
  if(m1||m2) save();
  render();
}

/* Variantes renombradas. El historial se guarda por nombre, así que al
   renombrar hay que mover los registros o quedan huérfanos. */
const RENAMES={
  'Lat pulldown agarre pronado ancho':'Lat pulldown agarre neutro ancho',
  'Dominadas supinas o neutras':'Dominadas',
  'Curl en polea detrás del cuerpo':'Bayesian curl en polea'
};
function migrateNames(){
  let cambio=false;
  Object.keys(RENAMES).forEach(function(viejo){
    const nuevo=RENAMES[viejo];
    if(S.hist[viejo]){
      S.hist[nuevo]=(S.hist[nuevo]||[]).concat(S.hist[viejo]).sort((x,y)=>fechaKey(y)-fechaKey(x));
      delete S.hist[viejo];cambio=true;
    }
    if(S.unit[viejo]){
      if(!S.unit[nuevo]) S.unit[nuevo]=S.unit[viejo];
      delete S.unit[viejo];cambio=true;
    }
    ['sel','last'].forEach(function(k){
      Object.values(S[k]||{}).forEach(function(d){
        if(!d) return;
        Object.keys(d).forEach(function(id){if(d[id]===viejo){d[id]=nuevo;cambio=true;}});
      });
    });
  });
  return cambio;
}

/* Traspasos de una sola vez: registros anotados en la variante equivocada.
   A diferencia de RENAMES, la variante de origen sigue existiendo, así que
   se mueve lo que había hasta hoy y se marca en S.mig para no repetirlo. */
const MOVES=[
  {id:'2026-09-hammer',de:'Chest press en máquina',a:'Press inclinado en Hammer'},
  {id:'2026-09-preacher',de:'Preacher curl con EZ',a:'Preacher curl en máquina'}
];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
/* fecha de un registro como número para ordenar. Los nuevos traen t (AAAA-MM-DD);
   los anteriores solo "24 sept", todos de 2026, cuando empezó la app. */
function fechaKey(x){
  if(x&&x.t) return new Date(x.t+'T12:00').getTime();
  const m=/(\d+)[^a-zñ]*([a-zñ]{3})/i.exec((x&&x.d)||''); if(!m) return 0;
  return new Date(2026,MESES.indexOf(m[2].toLowerCase()),+m[1],12).getTime();
}
const pad2=n=>String(n).padStart(2,'0');
const hoyISO=()=>{const t=new Date();return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());};
function migrateMoves(){
  let cambio=false; S.mig=S.mig||[];
  /* una versión anterior leía mal "sept" al ordenar: se reordena todo una vez */
  if(S.mig.indexOf('2026-09-orden')<0){
    Object.keys(S.hist).forEach(function(v){
      if(Array.isArray(S.hist[v])) S.hist[v].sort((x,y)=>fechaKey(y)-fechaKey(x));
    });
    S.mig.push('2026-09-orden'); cambio=true;
  }
  MOVES.forEach(function(mv){
    if(S.mig.indexOf(mv.id)>=0) return;
    if(S.hist[mv.de]){
      S.hist[mv.a]=(S.hist[mv.a]||[]).concat(S.hist[mv.de])
        .sort((x,y)=>fechaKey(y)-fechaKey(x));
      delete S.hist[mv.de];
      if(S.unit[mv.de]&&!S.unit[mv.a]) S.unit[mv.a]=S.unit[mv.de];
    }
    ['sel','last'].forEach(function(k){
      Object.keys(S[k]||{}).forEach(function(day){
        const d=S[k][day]; if(!d||!DAYS[day]) return;
        DAYS[day].ex.forEach(function(ex){
          if(d[ex.id]===mv.de&&ex.o.indexOf(mv.a)>=0) d[ex.id]=mv.a;
        });
      });
    });
    S.mig.push(mv.id); cambio=true;
  });
  return cambio;
}

/* El dropset era uno solo (ds/dw/dr). Ahora es una lista d:[{w,r},...].
   Convierte lo viejo para no perder nada de lo ya anotado. */
function migrateDrops(){
  const fix=function(r){
    if(!r||Array.isArray(r.d)) return;
    if(r.ds&&(r.dw||r.dr)) r.d=[{w:r.dw||'',r:r.dr||''}];
    else if(r.ds) r.d=[{w:'',r:''}];
    else r.d=[];
    delete r.ds;delete r.dw;delete r.dr;
  };
  Object.values(S.log||{}).forEach(d=>Object.values(d||{}).forEach(L=>Array.isArray(L)&&L.forEach(fix)));
  Object.values(S.hist||{}).forEach(H=>Array.isArray(H)&&H.forEach(e=>Array.isArray(e.s)&&e.s.forEach(fix)));
}
function save(){
  clearTimeout(timer);
  timer=setTimeout(()=>{STORE.set(JSON.stringify(S));},350);
}

const g=(o,d,i)=>(S[o][d]&&S[o][d][i])||null;
function set(o,d,i,v){(S[o][d]=S[o][d]||{})[i]=v;save();}
function rows(d,i,n){S.log[d]=S.log[d]||{};if(!S.log[d][i])S.log[d][i]=Array.from({length:n},()=>({w:'',r:''}));return S.log[d][i];}
const nd=x=>(x&&Array.isArray(x.d))?x.d.filter(z=>z.w||z.r).length:0;
const fmt=s=>s.filter(x=>x.w||x.r||nd(x)).map(function(x){
  const n=nd(x);return (x.w||'–')+'×'+(x.r||'–')+(n?' DS'+(n>1?'×'+n:''):'');}).join('  ');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
function usedThisWeek(){const u=new Set();['push','pull'].forEach(d=>Object.values(S.sel[d]||{}).forEach(v=>u.add(v)));return u;}

/* Conversión de unidades. Todo lo que se compara pasa por aquí, así que
   cambiar de kg a lb entre sesiones no rompe la progresión. */
const conv=(v,from,to)=>(from===to)?v:(from==='lb'?v/LB:v*LB);
const r1=v=>Math.round(v*10)/10;                 /* una décima basta: el gym no es un laboratorio */
const other=u=>u==='kg'?'lb':'kg';
/* peso de un set expresado en la unidad U, venga de donde venga */
const inU=(w,from,U)=>{const n=num(w);return n===null?null:r1(conv(n,from,U));};

function goal(v){
  const h=S.hist[v], U=unitOf(v);
  if(!h||!h.length) return {c:'none',k:'Sin registro',v:'Primera vez con esta variante. Anota peso y repeticiones para tener contra qué progresar.'};
  const hu=h[0].u||'kg';
  const last=h[0].s.filter(x=>num(x.w)!==null&&num(x.r)!==null);
  if(!last.length) return {c:'none',k:'Sin registro',v:'La última sesión quedó incompleta.'};
  /* la sesión anterior, traída a la unidad de hoy */
  const cv=last.map(x=>({w:inU(x.w,hu,U),r:num(x.r)}));
  const nota=(hu!==U)?' <i>(convertido desde '+hu+')</i>':'';
  const w=Math.max.apply(null,cv.map(x=>x.w));
  if(cv.every(x=>x.r>=TOP))
    return {c:'rise',k:'Sube el peso',v:'Cerraste <b>'+TOP+' repeticiones en todas las series</b> con '+w+' '+U+nota+'. Sube al siguiente incremento y vuelve a 8.'};
  return {c:'hold',k:'Mismo peso',v:'Última vez: <b>'+cv.map(x=>x.w+'×'+x.r).join('  ')+' '+U+'</b>'+nota+'. Mantén el peso y busca una repetición más en cada serie.'};
}

/* pu = unidad en que se anotó la serie anterior; se convierte antes de comparar */
function delta(cur,prev,u,pu){
  const cw=num(cur.w),cr=num(cur.r);
  if(cw===null||cr===null||!prev) return {c:'',x:''};
  const cr2=num(prev.r); const pw=inU(prev.w,pu||'kg',u||'kg');
  if(pw===null||cr2===null) return {c:'',x:''};
  const U=u||'kg', d=r1(cw-pw);
  /* zona muerta: bajo esto es ruido de redondeo entre unidades, no progreso real */
  const tol=(U==='lb')?0.5:0.25;
  if(d>tol) return {c:'u',x:'+'+d+' '+U};
  if(d<-tol) return {c:'d',x:'-'+Math.abs(d)+' '+U};
  if(cr>cr2) return {c:'u',x:'+'+(cr-cr2)+' rep'};
  if(cr<cr2) return {c:'d',x:'-'+(cr2-cr)+' rep'};
  return {c:'e',x:'='};
}

/* ---- Progreso por variante ----
   Por sesión toma la mejor serie según el 1RM estimado (Epley: peso × (1 + reps/30)),
   que sube tanto si agregas peso como si sacas más repeticiones. Todo en la unidad de hoy. */
const e1rm=(w,r)=>r>0?w*(1+r/30):0;
function puntos(v,U){
  return (S.hist[v]||[]).slice().reverse().map(function(x){
    const hu=x.u||'kg'; let b=null;
    (x.s||[]).forEach(function(s){
      const w=inU(s.w,hu,U), r=num(s.r); if(w===null||r===null||r<=0) return;
      const e=e1rm(w,r); if(!b||e>b.e||(e===b.e&&w>b.w)) b={e:e,w:w,r:r};
    });
    return b?{d:x.d,e:r1(b.e),w:b.w,r:b.r}:null;
  }).filter(Boolean);
}
function progreso(v,U){
  const p=puntos(v,U);
  if(!p.length) return '<div class="pgr"><p class="pnote">Todavía no hay series con peso y repeticiones para graficar.</p></div>';
  /* peso corporal sin lastre: no hay 1RM que calcular, se grafican las repeticiones */
  const reps=p.every(q=>q.w===0), val=q=>reps?q.r:q.e, un=reps?'rep':U;
  const vs=p.map(val), lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  const W=300,H=120,L=8,R=8,T=14,B=22, span=(hi-lo)||Math.max(1,hi*0.1);
  const X=i=>p.length===1?W/2:L+i*(W-L-R)/(p.length-1);
  const Y=v=>T+(H-T-B)*(1-(v-lo+(hi===lo?span/2:0))/span);
  const pts=p.map((q,i)=>X(i).toFixed(1)+','+Y(val(q)).toFixed(1)).join(' ');
  const best=p.reduce((a,q)=>val(q)>val(a)?q:a,p[0]);
  const top=p.reduce((a,q)=>(q.w>a.w||(q.w===a.w&&q.r>a.r))?q:a,p[0]);
  const ch=p.length>1&&vs[0]>0?Math.round((vs[vs.length-1]-vs[0])/vs[0]*100):null;
  const svg='<svg class="pchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución de '+(reps?'repeticiones':'fuerza estimada')+'">'+
    '<line x1="0" x2="'+W+'" y1="'+(H-B)+'" y2="'+(H-B)+'" class="pax"/>'+
    (p.length>1?'<polyline points="'+pts+'" class="pline"/>':'')+
    p.map((q,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(val(q)).toFixed(1)+'" r="'+(i===p.length-1?4.5:3)+'" class="pdot'+(q===best?' pbest':'')+'"/>').join('')+
    '<text x="'+L+'" y="'+(H-6)+'" class="ptx">'+p[0].d+'</text>'+
    (p.length>1?'<text x="'+(W-R)+'" y="'+(H-6)+'" class="ptx" text-anchor="end">'+p[p.length-1].d+'</text>':'')+
    '<text x="'+L+'" y="10" class="ptx">'+r1(hi)+' '+un+'</text></svg>';
  return '<div class="pgr">'+
    '<div class="pstats">'+
      '<div><b>'+(reps?best.r+' rep':r1(best.e)+' '+U)+'</b><span>'+(reps?'Mejor serie':'1RM estimado')+'</span></div>'+
      '<div><b>'+(reps?'—':top.w+' '+U+' × '+top.r)+'</b><span>Peso máximo</span></div>'+
      '<div><b>'+(ch===null?'—':(ch>0?'+':'')+ch+'%')+'</b><span>Desde la 1.ª</span></div>'+
    '</div>'+svg+
    '<p class="pnote">'+(reps?'Repeticiones de la mejor serie':'Mejor serie de cada sesión, como 1RM estimado')+' · '+p.length+' sesion'+(p.length===1?'':'es')+'. El punto dorado es tu mejor marca.</p>'+
  '</div>';
}

/* ---- Descanso ----
   3:00 para todo (el usuario decide si saltarlo). Solo arranca con el botón Descanso de la ficha.
   Se guarda la hora de término, no un contador: si la pantalla se apaga, al volver sigue bien.
   Una app web no puede sonar con el iPhone bloqueado, así que con la alarma activada el botón
   además corre el atajo "Descanso VANDAL", que pone el temporizador del Reloj (ese sí suena). */
const restOf=()=>180;
const ATAJO='Descanso VANDAL';
function alarmaIphone(sec){
  location.href='shortcuts://run-shortcut?name='+encodeURIComponent(ATAJO)+'&input=text&text='+sec;
}
function descansar(sec){startRest(sec); if(S.alarm) alarmaIphone(sec);}
const mmss=s=>Math.floor(s/60)+':'+pad2(Math.max(0,Math.round(s%60)));
let restEnd=0, restTick=null, restDone=0, actx=null;
function beep(){
  try{
    if(navigator.audioSession) navigator.audioSession.type='transient';
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22,0.44].forEach(function(t){
      const o=actx.createOscillator(), gn=actx.createGain(), t0=actx.currentTime+t;
      o.frequency.value=880; o.connect(gn); gn.connect(actx.destination);
      gn.gain.setValueAtTime(0.0001,t0); gn.gain.exponentialRampToValueAtTime(0.35,t0+0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001,t0+0.18); o.start(t0); o.stop(t0+0.2);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
/* iOS solo deja sonar audio que se desbloqueó con un toque: se prepara en el primer toque */
document.addEventListener('touchend',function un(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}
  document.removeEventListener('touchend',un);
},{passive:true});
function startRest(sec){
  restEnd=Date.now()+sec*1000; restDone=0;
  try{actx&&actx.state==='suspended'&&actx.resume();}catch(e){}
  clearInterval(restTick); restTick=setInterval(drawRest,250); drawRest();
}
function stopRest(){restEnd=0;restDone=0;clearInterval(restTick);restTick=null;drawRest();}
function drawRest(){
  let bar=document.getElementById('rest');
  if(!bar){bar=document.createElement('div');bar.id='rest';bar.className='rest';bar.setAttribute('role','timer');document.body.appendChild(bar);}
  if(!restEnd&&!restDone){bar.hidden=true;document.body.classList.remove('resting');return;}
  bar.hidden=false; document.body.classList.add('resting');
  const left=(restEnd-Date.now())/1000;
  if(left<=0&&!restDone){restDone=Date.now();if(!S.alarm)beep();}
  if(restDone){
    bar.className='rest over';
    bar.innerHTML='<span class="rl">Descanso</span><b>A la serie</b><button data-rx="stop">Listo</button>';
    if(Date.now()-restDone>8000) stopRest();
    return;
  }
  bar.className='rest';
  bar.innerHTML='<span class="rl">Descanso</span><b>'+mmss(Math.ceil(left))+'</b>'+
    /* con la alarma del iPhone el tiempo ya quedó en el Reloj: ajustarlo aquí lo descuadraría */
    (S.alarm?'':'<button data-rx="-15" aria-label="Quitar 15 segundos">−15</button>'+
    '<button data-rx="15" aria-label="Agregar 15 segundos">+15</button>')+
    '<button data-rx="stop">Saltar</button>';
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(restEnd||restDone))drawRest();});

/* ---- Resumen semanal ----
   Series hechas por músculo según la casilla de donde vino cada registro.
   Solo cuenta sesiones cerradas desde que los registros guardan la fecha completa. */
const SLOTM={p1:'Pecho',p2:'Pecho',p3:'Pecho',x1:'Pecho',x2:'Pecho',
  u1:'Espalda',u2:'Espalda',u3:'Espalda',u4:'Espalda',u10:'Espalda',x3:'Espalda',x4:'Espalda',
  p4:'Deltoide anterior',x5:'Deltoide anterior',p5:'Deltoide medio',x6:'Deltoide medio',u5:'Deltoide posterior',x7:'Deltoide posterior',
  p6:'Bíceps',p7:'Bíceps',u8:'Bíceps',u9:'Bíceps',x9:'Bíceps',p8:'Tríceps',p9:'Tríceps',u6:'Tríceps',u7:'Tríceps',x8:'Tríceps',
  l1:'Cuádriceps',l2:'Isquios',l3:'Isquios',l4:'Glúteo y aductores',l5:'Gemelos',l6:'Abdomen',l7:'Abdomen'};
function lunes(off){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+6)%7)+7*off);return t.getTime();}
function seriesSemana(off){
  const a=lunes(off), b=lunes(off+1), out={};
  Object.values(S.hist).forEach(h=>(h||[]).forEach(function(x){
    if(!x.t||!x.ex||!SLOTM[x.ex]) return;
    const k=fechaKey(x); if(k<a||k>=b) return;
    const n=(x.s||[]).filter(s=>num(s.r)!==null||num(s.w)!==null).length;
    out[SLOTM[x.ex]]=(out[SLOTM[x.ex]]||0)+n;
  }));
  return out;
}

/* ---- Récords ----
   Una serie es récord si su 1RM estimado supera el mejor de todo el historial de esa
   variante. Con margen chico para que el redondeo entre kg y lb no invente récords. */
function mejorE(v,U){const p=puntos(v,U);return p.length?Math.max.apply(null,p.map(q=>q.e)):null;}
const esRecord=(r,U,BE)=>{const w=num(r.w),n=num(r.r);return BE!==null&&w!==null&&n!==null&&w>0&&n>0&&e1rm(w,n)>BE+0.05;};
function chip(r,prev,U,pu,BE){return esRecord(r,U,BE)?{c:'pr',x:'Récord'}:delta(r,prev,U,pu);}

/* ---- Duración de la sesión ----
   Arranca con lo primero que anotas en el día. Un inicio de hace más de 5 horas
   es una sesión que quedó abierta: se descarta y parte de nuevo. */
const VIEJO=5*3600*1000;
function inicio(d){const t=(S.start||{})[d];return t&&Date.now()-t<VIEJO?t:null;}
function marcarInicio(d){S.start=S.start||{};if(!inicio(d)) S.start[d]=Date.now();}
const hmm=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+':'+pad2(m%60);};
setInterval(function(){
  const el=document.querySelector('[data-live]'), t=inicio(day);
  if(el&&t) el.textContent='En curso '+hmm(Date.now()-t);
},20000);

/* ---- Volumen y constancia (todo el historial, incluidos los registros antiguos) ---- */
function kgSesion(x){
  const hu=x.u||'kg'; let v=0;
  (x.s||[]).forEach(function(s){
    const w=inU(s.w,hu,'kg'), r=num(s.r); if(w!==null&&r!==null) v+=w*r;
    (Array.isArray(s.d)?s.d:[]).forEach(function(z){const zw=inU(z.w,hu,'kg'),zr=num(z.r);if(zw!==null&&zr!==null)v+=zw*zr;});
  });
  return v;
}
const ton=kg=>kg>=1000?(String(r1(kg/1000)).replace('.',','))+' t':Math.round(kg)+' kg';
const isoDe=ms=>{const t=new Date(ms);return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());};
function diasEntrenados(){
  const set=new Set();
  Object.values(S.hist).forEach(h=>(h||[]).forEach(function(x){const k=fechaKey(x);if(k)set.add(isoDe(k));}));
  return set;
}
/* semana cumplida = 4 días entrenados entre lunes y domingo */
function rachas(dias){
  const porSem={}; dias.forEach(function(d){const t=new Date(d+'T12:00');t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+6)%7));porSem[t.getTime()]=(porSem[t.getTime()]||0)+1;});
  /* se avanza con setDate y no sumando milisegundos: con el cambio de hora el lunes no dura 24 h */
  const hoy=lunes(0); let actual=0, larga=0, run=0;
  const keys=Object.keys(porSem).map(Number); if(!keys.length) return {actual:0,larga:0};
  const paso=(w,n)=>{const t=new Date(w);t.setDate(t.getDate()+n);return t.getTime();};
  for(let w=Math.min.apply(null,keys); w<=hoy; w=paso(w,7)){
    if((porSem[w]||0)>=4){run++;larga=Math.max(larga,run);}
    else if(w!==hoy) run=0;          /* la semana en curso no corta la racha */
  }
  for(let w=hoy, n=0; n<520; w=paso(w,-7), n++){
    if((porSem[w]||0)>=4) actual++;
    else if(w!==hoy) break;
  }
  return {actual:actual,larga:larga};
}
function calendario(dias){
  const COLS=18, hoy=new Date(); hoy.setHours(0,0,0,0);
  const ini=new Date(lunes(-(COLS-1))); let html='';
  for(let i=0;i<COLS*7;i++){
    const d=new Date(ini); d.setDate(ini.getDate()+i);
    const iso=isoDe(d.getTime()), fut=d>hoy, on=dias.has(iso);
    html+='<i class="'+(on?'on':'')+(fut?' fut':'')+(d.getTime()===hoy.getTime()?' hoy':'')+'" title="'+iso+'"></i>';
  }
  return '<div class="cal" role="img" aria-label="Días entrenados en las últimas '+COLS+' semanas">'+html+'</div>';
}

      (h.length?'<details class="hist"><summary>Historial · '+h.length+' sesion'+(h.length===1?'':'es')+ICON.chev+'</summary><ul>'+
        h.slice(0,10).map(x=>'<li><span>'+x.d+'</span>'+(fmt(x.s)||'—')+' '+(x.u||'kg')+'</li>').join('')+'</ul></details>':'')+
      '</div>' : '';

    return '<li class="card'+(isDone?' done':'')+(isOpen?' open':'')+(id===curId?' cur':'')+'">'+
      '<button class="head" data-open="'+id+'" aria-expanded="'+isOpen+'">'+
        '<span class="num">'+String(i+1).padStart(2,'0')+'<i></i></span>'+
        '<span class="body">'+
          '<span class="name">'+e.n+'</span>'+
          '<span class="target">'+e.t+'</span>'+
          (sel?'<span class="pick"><b>HOY</b>'+sel+'</span>':'')+
          (!sel&&prev?'<span class="prev">última vez · '+prev+'</span>':'')+
          (logged?'<span class="tally">'+logged+'</span>':'')+
        '</span>'+
        '<span class="right">'+
          '<span class="sets">'+nS+'×</span>'+
          '<span class="tick" role="checkbox" aria-checked="'+isDone+'" aria-label="Marcar hecho" data-tick="'+id+'">'+ICON.check+'</span>'+
          '<span class="chev">'+ICON.chev+'</span>'+
        '</span></button>'+
      '<div class="panel"><div class="opthead">Elige la que esté libre</div>'+
        e.o.map(function(o){
          const key=id+'|'+o, inf=INFO[o], isG=guide===key;
          return '<div class="optrow">'+
            '<button class="opt '+(sel===o?'on':'')+'" data-pick="'+id+'" data-val="'+o+'"><span class="dot"></span>'+o+
              (sel===o?'<span class="flag">elegida</span>':(used.has(o)?'<span class="stale">ya usada</span>':(prev===o?'<span class="stale">última vez</span>':'')))+
            '</button>'+
            (inf?'<button class="help '+(isG?'on':'')+'" data-guide="'+key+'" aria-expanded="'+isG+'" aria-label="Cómo se hace '+o+'">'+ICON.help+'</button>':'')+
          '</div>'+
          (inf&&isG?'<div class="guide"><div class="gh">Cómo se hace</div><div class="gb">'+
            (inf.g?'<img src="'+gifSrc(inf.g)+'" alt="'+o+'" loading="lazy" data-alt="'+(inf.i||'')+'" onerror="gifFail(this)">':
              inf.i?'<img src="'+inf.i+'" alt="'+o+'" loading="lazy" onerror="this.remove()">':'')+
            '<div class="gtx"><p>'+inf.d+'</p>'+
            '<a class="vid" href="https://www.youtube.com/results?search_query='+
              encodeURIComponent(o+' técnica ejercicio')+'" target="_blank" rel="noopener">'+ICON.play+'Ver demostración</a>'+
            (inf.g?'<p class="cred">Animación: '+gifCred(inf.g)+'</p>':
              inf.i?'<p class="cred">Ilustración: wger.de · CC BY-SA</p>':'')+
          '</div></div></div>':'');
        }).join('')+
        logBlock+
      '</div></li>';
  }).join('');

  const modeBar='<div class="modes">'+
    '<div class="segwrap"><span class="seglab">Duración</span><div class="seg">'+
      '<button class="'+(md==='largo'?'on':'')+'" data-md="largo">Largo</button>'+
      '<button class="'+(md==='corto'?'on':'')+'" data-md="corto">Corto</button>'+
    '</div></div>'+
    ((day==='push'||day==='pull')?'<div class="segwrap"><span class="seglab">Reparto de brazo</span><div class="seg">'+
      '<button class="'+(sp==='h'?'on':'')+'" data-sp="h">Híbrido</button>'+
      '<button class="'+(sp==='n'?'on':'')+'" data-sp="n">Normal</button>'+
    '</div></div>':'')+
  '</div>';

  /* marco de la máquina: título estampado y la etiqueta de especificación.
     Minutos ≈ 3 por serie (con descanso) + 5 de calentamiento, redondeado a 5. */
  const series=list.reduce((a,e)=>a+setsOf(e,day),0);
  const mins=Math.round((series*3+5)/5)*5;
  return '<header class="dayhead"><span class="emb" aria-hidden="true"><svg class="vmark"><use href="#vandal"/></svg></span>'+
      '<h1>'+d.title+'</h1><p class="sub">'+txt(d.sub)+'</p>'+
      '<p class="spec"><span>'+total+' ejercicios</span><span>'+series+' series</span>'+
        '<span data-live>'+(inicio(day)?'En curso '+hmm(Date.now()-inicio(day)):'~'+mins+' min')+'</span>'+
        '<span class="prog" aria-label="'+doneN+' de '+total+' ejercicios hechos"><b>'+doneN+'</b>/'+total+'</span></p>'+

    '<div class="finish"><button data-finish '+(doneN===0?'disabled':'')+'>Cerrar sesión de hoy</button>'+
    '<p>Guarda pesos, repeticiones y variantes en el historial. La próxima vez te muestra qué tienes que superar.</p></div>';
}

function constancia(){
  const dias=diasEntrenados(), R=rachas(dias);
  let kg=0; Object.values(S.hist).forEach(h=>(h||[]).forEach(x=>{kg+=kgSesion(x);}));
  const durs=(S.ses||[]).map(s=>s.min).filter(m=>m>0);
  const prom=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
  return '<div class="pstats const">'+
      '<div><b>'+dias.size+'</b><span>Sesiones</span></div>'+
      '<div><b>'+ton(kg)+'</b><span>Volumen total</span></div>'+
      '<div><b>'+(prom?hmm(prom*60000):'—')+'</b><span>Duración media</span></div>'+
      '<div><b>'+R.actual+' sem</b><span>Racha</span></div>'+
    '</div>'+calendario(dias)+
    '<p class="pnote">Últimas 18 semanas; cada cuadro es un día entrenado. La <b>racha</b> cuenta semanas seguidas con tus 4 días'+
      (R.larga?' (la más larga: '+R.larga+')':'')+'; la semana en curso no la corta. La duración media se llena con las sesiones que cierres desde ahora.</p>';
}

/* El pasador se ubica en el agujero de la placa actual. Si en el mismo día
   cambió de placa, baja deslizándose desde donde estaba: es el único
   movimiento de la app y respeta "reducir movimiento". */
let pinY=null, pinDay=null;
/* silent: solo reajusta la posición, sin animar (fuentes que llegan tarde,
   imágenes que cargan, rotación de pantalla) */
function placePin(silent){
  const st=document.querySelector('.stack'), pin=st&&st.querySelector('.pin');
  if(!pin){pinY=null;pinDay=null;return;}
  const hole=st.querySelector('.card.cur .num i');
  if(!hole){pin.style.display='none';pinY=null;pinDay=day;return;}
  const y=hole.getBoundingClientRect().top-st.getBoundingClientRect().top+hole.offsetHeight/2;
  pin.style.top=y+'px';
  const moved=!silent&&pinDay===day&&pinY!==null&&Math.abs(pinY-y)>1;
  const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(moved&&!calm&&pin.animate)
    pin.animate([{transform:'translateY('+(pinY-y)+'px)'},{transform:'translateY(0)'}],
                {duration:520,easing:'cubic-bezier(.16,1,.3,1)'});
  pinY=y;pinDay=day;
}
/* el alto de las placas cambia después de dibujar: cuando llegan las fuentes
   estampadas, cuando carga una ilustración o al rotar el teléfono */
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){placePin(true);});
window.addEventListener('resize',function(){placePin(true);});
document.addEventListener('load',function(e){if(e.target&&e.target.tagName==='IMG')placePin(true);},true);


/* escribir no redibuja la vista: solo refresca el indicador de esa fila */
document.addEventListener('input',function(e){
  const cv=e.target.closest('[data-conv]');
  if(cv){
    const v=num(cv.value), to=document.getElementById(cv.dataset.conv==='kg'?'clb':'ckg');
    if(!to) return;
    if(cv.value.trim()===''){to.value='';return;}
    if(v===null) return;
    to.value=String(+( cv.dataset.conv==='kg' ? v*LB : v/LB ).toFixed(2)).replace(/\.00$/,'');
    return;
  }
  const el=e.target.closest('[data-log]'); if(!el) return;
  const id=el.dataset.log, k=+el.dataset.set, f=el.dataset.f;
  const ex=DAYS[day].ex.find(x=>x.id===id); if(!ex) return;
  const L=rows(day,id,setsOf(ex,day));
  if(!L[k]) return;
  if(el.dataset.di!==undefined){          /* fila de descuelgue */
    const j=+el.dataset.di;
    if(Array.isArray(L[k].d)&&L[k].d[j]){L[k].d[j][f]=el.value.trim();save();}
    return;
  }
  L[k][f]=el.value.trim(); if(L[k][f]) marcarInicio(day); save();
  const sel=g('sel',day,id), h=sel?(S.hist[sel]||[]):[];
  /* misma unidad de origen que usa renderDay; sin ella una sesión anterior
     en lb se leía como kg y el chip mostraba subidas o bajadas falsas */
  const pu=h.length?(h[0].u||'kg'):'kg';
  const D=chip(L[k], h.length?h[0].s[k]:null, sel?unitOf(sel):'kg', pu, sel&&h.length?mejorE(sel,unitOf(sel)):null);
  const chip=document.querySelector('[data-d="'+id+'-'+k+'"]');
  if(chip){chip.className='delta '+D.c;chip.textContent=D.x;}
});

document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go){day=go.dataset.go;open=null;guide=null;prog=null;cierre=null;scrollTo(0,0);return render();}
  if(e.target.closest('[data-cierre]')){cierre=null;return render();}

  const rx=e.target.closest('[data-rx]');
  if(rx){const a=rx.dataset.rx;
    if(a==='stop') stopRest(); else {restEnd=Math.max(Date.now()+5000,restEnd+(+a)*1000);drawRest();}
    return;}
  const rb=e.target.closest('[data-rest]');
  if(rb){descansar(restOf(rb.dataset.rest));return;}
  const al=e.target.closest('[data-alarm]');
  if(al){const a=al.dataset.alarm;
    if(a==='test'){alarmaIphone(5);return;}
    S.alarm=(a==='on');save();return render();}
  const pb=e.target.closest('[data-prog]');
  if(pb){prog=(prog===pb.dataset.prog?null:pb.dataset.prog);return render();}

  const mdb=e.target.closest('[data-md]');
  if(mdb){S.mode[day]=mdb.dataset.md;open=null;guide=null;save();return render();}

  const spb=e.target.closest('[data-sp]');
  if(spb){S.split=spb.dataset.sp;open=null;guide=null;save();return render();}

  const ub=e.target.closest('[data-unit]');
  if(ub){
    const v=ub.dataset.uv, to=ub.dataset.unit, from=unitOf(v);
    if(from!==to){
      /* convierte lo que ya está escrito hoy, para no retipear nada */
      exList(day).forEach(function(ex){
        if(g('sel',day,ex.id)!==v) return;
        const L=(S.log[day]||{})[ex.id]; if(!L) return;
        L.forEach(function(r){
          const w=num(r.w); if(r.w!==''&&w!==null) r.w=String(r1(conv(w,from,to)));
          if(Array.isArray(r.d)) r.d.forEach(function(z){
            const zw=num(z.w); if(z.w&&zw!==null) z.w=String(r1(conv(zw,from,to)));
          });
        });
      });
      S.unit[v]=to;
    }
    save();return render();
  }

  /* DS enciende o apaga la cascada entera; dadd/dsub agregan o quitan descuelgues */
  const dz=e.target.closest('[data-ds],[data-dadd],[data-dsub]');
  if(dz){
    const kind=dz.dataset.ds?'t':(dz.dataset.dadd?'a':'s');
    const p=(dz.dataset.ds||dz.dataset.dadd||dz.dataset.dsub).split('|'), id=p[0], k=+p[1];
    const ex=DAYS[day].ex.find(x=>x.id===id); if(!ex) return;
    const L=rows(day,id,setsOf(ex,day)); const r=L[k]; if(!r) return;
    if(!Array.isArray(r.d)) r.d=[];
    if(kind==='t') r.d = r.d.length ? [] : [{w:'',r:''}];
    else if(kind==='a'){ if(r.d.length<4) r.d.push({w:'',r:''}); }
    else { r.d.pop(); }
    save();return render();
  }

  const tick=e.target.closest('[data-tick]');
  if(tick){e.stopPropagation();const id=tick.dataset.tick;set('done',day,id,!g('done',day,id));return render();}

  const add=e.target.closest('[data-add]');
  if(add){const id=add.dataset.add,ex=DAYS[day].ex.find(x=>x.id===id);
    if(ex)rows(day,id,setsOf(ex,day)).push({w:'',r:''});save();return render();}

  const sub=e.target.closest('[data-sub]');
  if(sub){const id=sub.dataset.sub,ex=DAYS[day].ex.find(x=>x.id===id);
    if(ex){const L=rows(day,id,setsOf(ex,day)); if(L.length>1)L.pop();}
    save();return render();}

  const gd=e.target.closest('[data-guide]');
  if(gd){const k=gd.dataset.guide;guide=(guide===k?null:k);return render();}

  const pick=e.target.closest('[data-pick]');
  if(pick){
    const id=pick.dataset.pick, v=pick.dataset.val, cur=g('sel',day,id);
    set('sel',day,id,cur===v?null:v);
    S.log[day]=S.log[day]||{}; delete S.log[day][id];
    save(); return render();
  }

  const head=e.target.closest('[data-open]');
  if(head){const id=head.dataset.open;open=(open===id?null:id);guide=null;return render();}

  if(e.target.closest('[data-finish]')){
    const stamp=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'short'});
    const t0=inicio(day), min=t0?Math.max(1,Math.round((Date.now()-t0)/60000)):null;
    const sum={dia:day,min:min,series:0,kg:0,pr:[]};
    exList(day).forEach(function(ex){
      const v=g('sel',day,ex.id), L=(S.log[day]||{})[ex.id];
      if(!v||!L) return;
      const s=L.filter(x=>x.w!==''||x.r!==''||nd(x));
      if(!s.length) return;
      /* resumen: se mide contra el historial de antes de guardar esta sesión */
      const U=unitOf(v), BE=(S.hist[v]||[]).length?mejorE(v,U):null;
      const top=s.filter(x=>esRecord(x,U,BE)).sort((a,b)=>e1rm(num(b.w),num(b.r))-e1rm(num(a.w),num(a.r)))[0];
      if(top) sum.pr.push({v:v,x:top.w+' '+U+' × '+top.r});
      sum.series+=s.length; sum.kg+=kgSesion({u:U,s:s});
      /* t: fecha completa; dia y ex: de qué día y casilla vino (para el resumen semanal).
         Sin tope: el historial completo es lo que permite ver el progreso de meses. */
      S.hist[v]=[{d:stamp,t:hoyISO(),dia:day,ex:ex.id,u:unitOf(v),s:s.map(x=>({w:x.w,r:x.r,
        d:(Array.isArray(x.d)?x.d.filter(z=>z.w||z.r).map(z=>({w:z.w,r:z.r})):[])}))}]
        .concat(S.hist[v]||[]);
    });
    S.last[day]=Object.assign({},S.last[day],S.sel[day]);
    S.sel[day]={};S.done[day]={};S.log[day]={};
    if(min) S.ses.push({t:hoyISO(),dia:day,min:min});
    if(S.start) delete S.start[day];
    cierre=sum; stopRest();
    save();open=null;scrollTo(0,0);return render();
  }

  if(e.target.closest('[data-reset]')){
    if(!confirm('¿Borrar todo el historial? Esto no se puede deshacer. Si no tienes un respaldo, cópialo antes en Notas → Respaldo.')) return;
    S={sel:{},done:{},last:{},log:{},hist:{},mode:{},split:'h',unit:{},start:{},ses:[],mig:MOVES.map(m=>m.id)};save();return render();}

  const bk=e.target.closest('[data-bk]');
  if(bk){
    const act=bk.dataset.bk;
    if(act==='copy'){
      const txt=backupText(), out=document.getElementById('bk-out');
      const fallback=function(){ if(out){out.hidden=false;out.value=txt;out.focus();out.select();}
        bkMsg('Selecciona todo el texto de arriba y cópialo.'); };
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(function(){bkMsg('Respaldo copiado. Ahora pégalo en la app nueva, en Notas → Respaldo → Restaurar.');},fallback);
      else fallback();
      return;
    }
    if(act==='file'){
      const blob=new Blob([backupText()],{type:'application/json'}), a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='vandal-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      bkMsg('Archivo generado. Guárdalo en Archivos para restaurarlo después.');
      return;
    }
    if(act==='restore'){ const t=document.getElementById('bk-in'); restoreBackup(t?t.value:''); return; }
  }
});

/* ---- Respaldo: exportar e importar todo el estado ---- */
function backupSummary(st){
  const h=(st&&st.hist)||{}, vars=Object.keys(h).length;
  const ses=Object.values(h).reduce(function(a,x){return a+(Array.isArray(x)?x.length:0);},0);
  return vars?('Tienes <b>'+vars+'</b> variante'+(vars===1?'':'s')+' con historial y <b>'+ses+'</b> sesi'+(ses===1?'ón':'ones')+' guardadas.')
             :'Todavía no hay sesiones guardadas en este ícono.';
}
function backupText(){ return JSON.stringify({app:'vandal',formato:1,fecha:new Date().toISOString(),datos:S}); }
function bkMsg(t,bad){ const m=document.getElementById('bk-msg'); if(m){m.textContent=t;m.className='bkmsg'+(bad?' bad':'');} }
function restoreBackup(raw){
  raw=String(raw||'').trim();
  if(!raw){ bkMsg('Primero pega el respaldo en el cuadro.',true); return; }
  let obj; try{ obj=JSON.parse(raw); }catch(err){ bkMsg('Ese texto no es un respaldo válido. Cópialo completo, desde la primera llave hasta la última.',true); return; }
  const d=(obj&&obj.datos)?obj.datos:obj;
  if(!d||typeof d!=='object'||typeof d.hist!=='object'){ bkMsg('Ese texto no parece un respaldo de esta app.',true); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=backupSummary(d);
  if(!confirm('Vas a reemplazar lo que hay en este ícono por el respaldo. '+tmp.textContent+' ¿Continuar?')) return;
  S=Object.assign({sel:{},done:{},last:{},log:{},hist:{},mode:{},split:'h',unit:{}},d);
  ['sel','done','last','log','hist','mode','unit','start'].forEach(function(k){S[k]=S[k]||{};});
  if(!Array.isArray(S.ses)) S.ses=[];
  if(S.split!=='h'&&S.split!=='n') S.split='h';
  migrateDrops(); migrateNames(); migrateMoves();
  STORE.set(JSON.stringify(S));
  day='notes'; render();
  bkMsg('Listo: historial restaurado.');
}
document.addEventListener('change',function(e){
  if(e.target.id!=='bk-file'||!e.target.files||!e.target.files[0]) return;
  const r=new FileReader();
  r.onload=function(){ restoreBackup(r.result); };
  r.onerror=function(){ bkMsg('No se pudo leer el archivo.',true); };
  r.readAsText(e.target.files[0]);
  e.target.value='';
});

load();

/* --- Auto-actualización ---------------------------------------------------
   iOS guarda en caché la página del ícono y se queda con la versión vieja
   después de cada update. Al abrir la app pedimos el archivo saltándonos la
   caché, comparamos su número de versión con el que está corriendo y, si
   cambió, recargamos una vez. Sin señal falla en silencio y no molesta. */
const VER=(document.querySelector('meta[name="app-version"]')||{}).content||'0';

async function checkUpdate(){
  try{
    const url=location.pathname+'?cb='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) return;
    const txt=await res.text();
    /* regex armado desde string para que este archivo no se auto-detecte */
    const m=txt.match(new RegExp('app-version"\\s+content="([^"]+)"'));
    if(!m) return;
    const nueva=m[1];
    if(nueva===VER) return;
    /* si ya veníamos de un intento con esa misma versión, no insistir */
    if(new URLSearchParams(location.search).get('v')===nueva) return;
    location.replace(location.pathname+'?v='+encodeURIComponent(nueva));
  }catch(e){/* sin señal o error de red: seguimos con lo que ya está cargado */}
}
setTimeout(checkUpdate,1200);
